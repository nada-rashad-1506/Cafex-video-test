<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cafex Video Test</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#26090d;color:#fff;font:16px Arial,sans-serif;padding:24px}
header{max-width:1100px;margin:0 auto 26px}h1{font-size:25px;margin:0 0 8px}p{color:#d8c9ca;margin:0;line-height:1.5}
section{max-width:1100px;margin:28px auto}h2{font-size:19px;margin:0 0 16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}
.card{background:#3a171c;border-radius:10px;padding:12px;min-width:0}.card h3{font-size:14px;font-weight:600;min-height:34px;margin:0 0 10px;line-height:1.3}
.frame{width:100%;aspect-ratio:9/16;background:#090909;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:5px}
video{display:block;width:100%;height:100%;object-fit:contain;object-position:center;background:#090909}
.note{font-size:12px;color:#d8c9ca;margin-top:9px}
@media(max-width:520px){body{padding:16px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{padding:8px}.card h3{font-size:12px;min-height:44px}}
</style></head><body>
<header><h1>Cafex — Video Preview Test</h1><p>Testing the actual video files with centered, uncropped 9:16 players. Tap play on each video.</p></header>
<section><h2>On-ground coverage</h2><div class="grid">
<article class="card"><h3>Coverage 1</h3><div class="frame"><video controls playsinline preload="metadata"><source src="videos/Cafex _ On-ground coverage - Reel 1.mp4" type="video/mp4"></video></div></article>
<article class="card"><h3>Coverage 2</h3><div class="frame"><video controls playsinline preload="metadata"><source src="videos/Cafex _ On-ground coverage - Reel 2.mp4" type="video/mp4"></video></div></article>
<article class="card"><h3>Coverage 3</h3><div class="frame"><video controls playsinline preload="metadata"><source src="videos/Cafex _ On-ground coverage - Reel 3.mp4" type="video/mp4"></video></div></article>
<article class="card"><h3>Coverage 4</h3><div class="frame"><video controls playsinline preload="metadata"><source src="videos/Cafex _ On-ground coverage - Reel 4.mp4" type="video/mp4"></video></div></article>
</div></section>
<section><h2>Pre-event social reels</h2><div class="grid">
<article class="card"><h3>Pre-event social reel 1</h3><div class="frame"><video controls playsinline preload="metadata"><source src="videos/Cafex _ Pre-event social reel 1.mp4" type="video/mp4"></video></div></article>
<article class="card"><h3>Pre-event social reel 2</h3><div class="frame"><video controls playsinline preload="metadata"><source src="videos/Cafex _ Pre-event social reel 2.mp4" type="video/mp4"></video></div></article>
</div></section>
</body></html>
